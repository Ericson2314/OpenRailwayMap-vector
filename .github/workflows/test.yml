name: Test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free the runner disk for the Nix store (as hackage-server does).
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          nix-permission-edict: true

      # The integration test runs the stack in a systemd-nspawn container inside
      # the build sandbox, which needs the uid-range feature.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes auto-allocate-uids cgroups
            extra-system-features = uid-range
            auto-allocate-uids = true
            use-cgroups = true

      - name: Build packages and hosts
        run: |
          nix build --print-build-logs --no-link \
            .#generated .#orm-import .#orm-martin .#orm-api \
            .#nixosConfigurations.container.config.system.build.toplevel \
            .#nixosConfigurations.image.config.system.build.toplevel

      - name: Unit tests, schema validation, formatting
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.import-test \
            .#checks.x86_64-linux.feature-test \
            .#checks.x86_64-linux.formatting

      - name: Integration test (NixOS container with Berlin data, API and proxy test suites)
        run: nix build --print-build-logs --no-link .#checks.x86_64-linux.container-test

      - name: Store preset
        run: |
          nix build --no-link --print-out-paths .#generated > generated.path
          cp "$(cat generated.path)/preset.zip" preset.zip
      - uses: actions/upload-artifact@v4
        with:
          name: preset
          path: preset.zip
